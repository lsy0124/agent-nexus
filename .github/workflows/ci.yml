name: Offline behavior tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project dependencies and build
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Run local tests and build (no model credentials)
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Browser acceptance on isolated local fixtures
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/browser_test.py
      - name: Audit export candidate (no historical state)
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/release_source.py audit
